<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Checkout</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:4px 2px 32px; }
  #hint { text-align:center; color:#8A8A8A; font-size:14px; padding-top:40vh; }
</style>
</head>
<body>
<main><p id="hint">Loading secure checkout&hellip;</p><div id="checkout"></div></main>
<script>
  // Renno's Whop checkout host page. The app's payment sheet (a WebView) loads this with
  // ?plan=plan_XXX&session=ch_XXX. The ch_ is a checkout configuration created server-side
  // by create-entry-purchase and carries the entry metadata, so the payment webhook flow is
  // identical to the hosted page. Setup mode (save a card, no charge) sends ?session=ch_XXX
  // alone. The buyer email rides the URL FRAGMENT (#email=...) so it never reaches any log.
  //
  // WHOP ELEMENTS (2026-10-15): Whop retired the legacy data-attribute embed
  // (js.whop.com/static/checkout/loader.js) on 2026-10-21. Elements mints the checkout
  // session from our configuration in the browser; no API key lives on this page. A finished
  // checkout navigates this tab to returnUrl with payment|setup and
  // status=succeeded|failed|canceled appended; the app intercepts that go?pay=done navigation
  // (WhopEmbeddedCheckoutHost) and the membership poll, not this URL, decides "paid".
  //
  // MOUNT AFTER LOAD (launch-day outage fix, 2026-09-03): Whop's third-party graph (whop.com
  // behind Cloudflare, Stripe, card vaults) must not participate in THIS page's load event,
  // or the app's WebView "page loaded" signal can hang and the runner stares at "Opening
  // checkout" for good. The Elements script is injected only after window load. Do not
  // "simplify" this back to a static script tag.
  //
  // ONE TICK LATER, NOT INSIDE THE LOAD HANDLER (2026-11-12): WebKit holds didFinishNavigation
  // and estimatedProgress=1 until every load STARTED inside the load handler finishes, and
  // every frame that script creates. Injecting synchronously in the handler therefore kept
  // Whop's whole graph (elements.js, its tracking scripts, its iframes, the card vault,
  // PayPal, Apple Pay) inside the app's 12 s paint timer, and runners on slow connections
  // were sent to Whop's hosted page (1-4% of in-app checkouts). setTimeout(inject, 0) runs
  // after WebKit has reported the page finished (WKWebView probe: finish 0.45 s instead of
  // 8.4 s). The trade: a stall INSIDE Whop's form now shows the hint below, not the fallback.
  var RETURN_URL = 'https://yljdthvzchfdaloeivdo.supabase.co/functions/v1/go?pay=done';
  var q = new URLSearchParams(location.search);
  var clean = function (v) { return (v || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 128); };
  var plan = clean(q.get('plan'));
  var session = clean(q.get('session'));
  var email = '';
  if (location.hash.indexOf('#email=') === 0) {
    try { email = decodeURIComponent(location.hash.slice(7)).slice(0, 254); } catch (e) { email = ''; }
  }
  var hint = document.getElementById('hint');

  if (session.indexOf('ch_') === 0 && (plan.indexOf('plan_') === 0 || !plan)) {
    var mount = function () {
      var whop = window.WhopElements({ appearance: { theme: { appearance: 'light', accentColor: 'orange' } } });
      var checkout = whop.checkout.create({
        checkoutConfiguration: session,
        returnUrl: RETURN_URL,
        onComplete: function () {
          // Elements navigates to returnUrl right after this. Backstop only: if that
          // navigation never happens, leave anyway so the sheet closes onto the poll.
          setTimeout(function () { location.replace(RETURN_URL + '&status=succeeded'); }, 4000);
        },
      });
      var props = {
        onReady: function () { if (hint) hint.remove(); },
        onError: function () { if (hint) hint.textContent = 'Checkout could not load. Close this and try again.'; },
      };
      if (email.indexOf('@') > 0) props.buyerEmail = email;
      checkout.create('checkout', props).mount('#checkout');
    };
    var inject = function () {
      var s = document.createElement('script');
      s.src = 'https://cdn.whop.com/elements/amber/elements.js';
      s.setAttribute('data-whop-elements', '');
      s.async = true;
      s.onload = mount;
      s.onerror = function () { if (hint) hint.textContent = 'Checkout could not load. Close this and try again.'; };
      document.head.appendChild(s);
    };
    var injectAfterFinish = function () { setTimeout(inject, 0); };
    if (document.readyState === 'complete') { injectAfterFinish(); }
    else { window.addEventListener('load', injectAfterFinish); }
  } else {
    document.body.innerHTML = '<p style="text-align:center;color:#8A8A8A;padding-top:40vh">Bad checkout link</p>';
  }
</script>
</body>
</html>
